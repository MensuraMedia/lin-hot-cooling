<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #080C17; font-family: Manrope, Ubuntu, Cantarell, sans-serif; color: #F5F7FA; }
    a { color: #C1FF14; } a:hover { color: #D9FF6B; }
    .nav { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 14px; border-radius: 12px; color: #8B8F99; font-size: 14px; font-weight: 500; text-decoration: none; }
    .nav svg { width: 20px; height: 20px; flex-shrink: 0; }
    .nav-on { background: rgba(193, 255, 20, 0.10); color: #C1FF14; }
    .card { background: #1E222E; border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 18px; box-sizing: border-box; }
    .cap { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #8B8F99; }
    .num { font-variant-numeric: tabular-nums; }
    .seg { height: 40px; min-width: 104px; padding: 0 18px; border: 0; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; background: transparent; }
    .hero-nominal { background-image: linear-gradient(135deg, #DCFCE7 0%, #86EFAC 45%, #22C55E 100%); color: #052E16; }
    .hero-medium { background-image: linear-gradient(135deg, #FEF9C3 0%, #FDE047 50%, #EAB308 100%); color: #1A1204; }
    .hero-intense { background-image: linear-gradient(135deg, #DC2626 0%, #B91C1C 55%, #7F1D1D 100%); color: #FFFFFF; }
    .segtrack-nominal { background: rgba(5, 46, 22, 0.12); }
    .segtrack-medium { background: rgba(26, 18, 4, 0.12); }
    .segtrack-intense { background: rgba(0, 0, 0, 0.22); }
    .seg-on-nominal { background: #052E16; color: #4ADE80; }
    .seg-off-nominal { color: #052E16; }
    .seg-on-medium { background: #1A1204; color: #FDE047; }
    .seg-off-medium { color: #1A1204; }
    .seg-on-intense { background: #FFFFFF; color: #B91C1C; }
    .seg-off-intense { color: #FFFFFF; }
    .spin { animation-name: hcspin; animation-timing-function: linear; animation-iteration-count: infinite; }
    .pulse { animation: hcpulse 1s ease-in-out infinite; }
    @keyframes hcspin { to { transform: rotate(360deg); } }
    @keyframes hcpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { .spin, .pulse { animation: none; } }
  </style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; background: #080C17; overflow: hidden;">

  <nav aria-label="Main" style="width: 216px; flex-shrink: 0; box-sizing: border-box; padding: 24px 14px; display: flex; flex-direction: column; gap: 4px; background-image: linear-gradient(180deg, #0D1322 0%, #080C17 100%); border-right: 1px solid rgba(255, 255, 255, 0.05);">
    <div style="display: flex; align-items: center; gap: 12px; padding: 0 8px 22px;">
      <div style="width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background-image: linear-gradient(135deg, #1E2A12 0%, #0B101D 100%); border: 1px solid rgba(193, 255, 20, 0.35);">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#C1FF14" stroke-width="1.7" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><path d="M12 10C12 6 13 3 16 3s3 3 0 5z"/><path d="M14 12c4 0 7 1 7 4s-3 3-5 0z"/><path d="M12 14c0 4-1 7-4 7s-3-3 0-5z"/><path d="M10 12c-4 0-7-1-7-4s3-3 5 0z"/></svg>
      </div>
      <div style="display: flex; flex-direction: column;">
        <span style="font-size: 16px; font-weight: 800; letter-spacing: -0.01em;">Hot Cooling</span>
        <span style="font-size: 12px; color: #8B8F99;">Thermal control</span>
      </div>
    </div>
    <a class="nav" href="Main.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Overview</a>
    <a class="nav" href="Fans.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><path d="M12 10C12 6 13 3 16 3s3 3 0 5z"/><path d="M14 12c4 0 7 1 7 4s-3 3-5 0z"/><path d="M12 14c0 4-1 7-4 7s-3-3 0-5z"/><path d="M10 12c-4 0-7-1-7-4s3-3 5 0z"/></svg>Fans</a>
    <a class="nav" href="Main.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/><path d="M12 9v7"/></svg>Thermals</a>
    <a class="nav" href="Main.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Power</a>
    <a class="nav" href="Main.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Profiles</a>
    <a class="nav nav-on" href="Templates.dc.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>Templates</a>
    <a class="nav" href="Main.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 14 10"/><path d="m14 10 2-2 2 2-2 2z"/><path d="M18 3v2M21 6h-2"/></svg>Automation</a>
    <a class="nav" href="Hardware.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg>Hardware</a>
    <a class="nav" href="Main.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Benchmarks</a>
    <a class="nav" href="Main.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</a>
    <div style="flex-grow: 1;"></div>
    <a class="nav" href="Main.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Settings</a>
  </nav>

  <main style="flex-grow: 1; box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 18px; min-width: 0;">
    <header style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em;">Templates</h1>
        <span style="font-size: 14px; color: #8B8F99;">Cooling recipes built from heat vectors · 9 shipped · 0 custom</span>
      </div>
      <div style="display: flex; gap: 10px; align-items: center;">
        <div role="group" aria-label="Filter by category" style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: #1E222E;">
          <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
            <button class="seg" style="min-width: 72px; height: 36px; {{f.style}}" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}">{{f.label}}</button>
          </sc-for>
        </div>
        <button style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: #C1FF14; color: #0A0F05; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#0A0F05" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New template</button>
      </div>
    </header>

    <div style="display: flex; gap: 16px; flex-grow: 1; min-height: 0;">
      <section style="flex-grow: 1; min-width: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: 200px; gap: 14px; align-content: start;">
        <sc-for list="{{cards}}" as="t" hint-placeholder-count="9">
          <button onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="text-align: left; font-family: inherit; color: #F5F7FA; cursor: pointer; border-radius: 18px; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; background: #1E222E; {{t.border}}">
            <span style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
              <span style="width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: {{t.iconBg}};">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="{{t.color}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.icon}}"/></svg>
              </span>
              <span style="height: 24px; padding: 0 10px; border-radius: 999px; display: flex; align-items: center; font-size: 11px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: {{t.color}}; background: {{t.iconBg}};">{{t.cat}}</span>
            </span>
            <span style="font-size: 15px; font-weight: 700;">{{t.name}}</span>
            <span style="font-size: 12px; line-height: 1.45; color: #8B8F99;">{{t.desc}}</span>
            <span style="display: flex; gap: 6px; flex-wrap: wrap;">
              <sc-for list="{{t.vectors}}" as="v" hint-placeholder-count="2">
                <span style="height: 22px; padding: 0 8px; border-radius: 999px; display: flex; align-items: center; font-size: 11px; font-weight: 600; color: #B9BDC6; background: #2A2E3A;">{{v}}</span>
              </sc-for>
            </span>
          </button>
        </sc-for>
      </section>

      <aside aria-label="Template details" style="width: 340px; flex-shrink: 0; border-radius: 22px; overflow: hidden; background: #1E222E; border: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column;">
        <div style="padding: 20px 22px; display: flex; flex-direction: column; gap: 6px; {{sel.heroStyle}}">
          <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.8;">{{sel.cat}} cooling</span>
          <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.01em;">{{sel.name}}</span>
          <span style="font-size: 13px; font-weight: 600; opacity: 0.85;">{{sel.when}}</span>
        </div>
        <div style="padding: 18px 22px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1;">
          <span class="cap">Resolved on this machine</span>
          <sc-for list="{{sel.rows}}" as="r" hint-placeholder-count="6">
            <div style="display: flex; gap: 10px; align-items: flex-start;">
              <span style="width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: {{r.bg}};">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="{{r.fg}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"/></svg>
              </span>
              <span style="display: flex; flex-direction: column; gap: 1px;">
                <span style="font-size: 13px; font-weight: 700;">{{r.label}}</span>
                <span style="font-size: 12px; color: #8B8F99;">{{r.note}}</span>
              </span>
            </div>
          </sc-for>
        </div>
        <div style="padding: 16px 22px 20px; display: flex; gap: 10px;">
          <button style="flex-grow: 1; height: 44px; border: 0; border-radius: 999px; background: #C1FF14; color: #0A0F05; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer;">Apply now</button>
          <button style="height: 44px; padding: 0 18px; border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; background: transparent; color: #F5F7FA; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;">Clone</button>
        </div>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const filter = (this.state && this.state.filter) || 'all';
    const selected = (this.state && this.state.selected) || 'gaming';
    const ICON = {
      gaming: 'M7 7h10a5 5 0 0 1 0 11H7A5 5 0 0 1 7 7zM7 10v5M4.5 12.5h5M16 11.5h.01M18 14h.01',
      esports: 'M8 4h8v5a4 4 0 0 1-8 0zM8 6H4a3 3 0 0 0 4 4M16 6h4a3 3 0 0 1-4 4M12 13v4M8 21h8',
      longrun: 'M6 2h12M6 22h12M7 2c0 5 10 5 10 10S7 17 7 22M17 2c0 5-10 5-10 10s10 5 10 10',
      dev: 'm8 7-5 5 5 5M16 7l5 5-5 5',
      general: 'M5 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zM8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18',
      media: 'M6 5h12a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3zM10 9l5 3-5 3z',
      quiet: 'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z',
      battery: 'M4 7h14a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zM22 11v2M6 10v4',
      cooldown: 'M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7'
    };
    const CAT = {
      intense: { label: 'Intense', color: '#FF5468', bg: 'rgba(220, 20, 60, 0.16)', hero: 'background-image: linear-gradient(135deg, #C8102E 0%, #A50E2A 55%, #6B0A1A 100%); color: #FFFFFF;' },
      optimal: { label: 'Optimal', color: '#C1FF14', bg: 'rgba(193, 255, 20, 0.12)', hero: 'background-image: linear-gradient(135deg, #ECFEC2 0%, #D6F2A5 45%, #B8E86A 100%); color: #0A0F05;' },
      idle: { label: 'Idle', color: '#5DDEA5', bg: 'rgba(93, 222, 165, 0.14)', hero: 'background-image: linear-gradient(135deg, #D8FBEA 0%, #8FE8C1 55%, #3FBF88 100%); color: #06140E;' }
    };
    const OK = { icon: 'm5 12 5 5 9-10', bg: 'rgba(93, 222, 165, 0.16)', fg: '#5DDEA5' };
    const NA = { icon: 'M6 12h12', bg: '#2A2E3A', fg: '#8B8F99' };
    const PART = { icon: 'M12 7v6M12 17h.01', bg: 'rgba(245, 197, 66, 0.16)', fg: '#F5C542' };
    const row = (k, label, note) => ({ ...k, label, note });
    const T = [
      { id: 'gaming', cat: 'intense', name: 'High-Intensity Gaming', desc: 'Long AAA sessions with CPU and GPU both under load.', vectors: ['mixed.gaming', 'gpu.sustained'],
        when: 'When a game starts · on AC power',
        rows: [row(OK, 'Profile → performance', 'Through power-profiles-daemon'), row(OK, 'CPU preference → performance', 'intel_pstate EPP, turbo on'),
               row(OK, 'Fan boost above CPU 85 °C / GPU 80 °C', 'Full speed for 45 s, then automatic'), row(NA, 'Fan curve', 'Not supported by this fan'),
               row(PART, 'GPU power cap', 'Advisory only: laptop GPU limit is locked'), row(OK, 'Pause charging above 40 °C', 'Uses the battery charge limit')] },
      { id: 'esports', cat: 'intense', name: 'Esports / Competitive', desc: 'Lowest latency: instant ramp-up, no boost delay.', vectors: ['mixed.gaming', 'cpu.burst'],
        when: 'Manual or per-game rule',
        rows: [row(OK, 'Profile → performance', 'Through power-profiles-daemon'), row(OK, 'CPU preference → performance', 'Turbo on'), row(OK, 'Immediate fan boost', 'No hold-off delay'), row(NA, 'Fan curve', 'Not supported by this fan')] },
      { id: 'longrun', cat: 'intense', name: 'Long-Running Operations', desc: 'Builds, renders and training that run for hours.', vectors: ['cpu.sustained', 'io.storage'],
        when: 'Sustained load over 10 minutes',
        rows: [row(OK, 'Profile → performance', 'Steps down to balanced if throttling grows'), row(PART, 'CPU power cap below throttle point', 'Needs the helper (RAPL)'), row(OK, 'Fan boost with 60 s hold', 'Avoids pulsing'), row(OK, 'NVMe temperature watch', 'Alert at 70 °C')] },
      { id: 'dev', cat: 'optimal', name: 'Development', desc: 'Compile bursts: fast ramp-up, fast ramp-down.', vectors: ['cpu.burst', 'cpu.sustained'],
        when: 'Compiler or IDE build detected',
        rows: [row(OK, 'Profile → balanced', 'Through power-profiles-daemon'), row(OK, 'CPU preference → balance performance', 'Turbo on'), row(OK, 'Short fan boost on bursts', '15 s hold')] },
      { id: 'general', cat: 'optimal', name: 'General Operations', desc: 'Everyday browsing, office work and chat.', vectors: ['cpu.burst'],
        when: 'Default on AC when nothing else applies',
        rows: [row(OK, 'Profile → balanced', 'Through power-profiles-daemon'), row(OK, 'Fans automatic', 'Firmware table'), row(NA, 'Boosts', 'Not used')] },
      { id: 'media', cat: 'optimal', name: 'Media & Streaming', desc: 'Steady fans for video, calls and light encoding.', vectors: ['gpu.sustained', 'cpu.sustained'],
        when: 'Media player or encoder running',
        rows: [row(OK, 'Profile → balanced', 'Keeps fan noise steady'), row(OK, 'Prefer iGPU decode', 'PRIME advice'), row(NA, 'Boosts', 'Not used')] },
      { id: 'quiet', cat: 'idle', name: 'Quiet Office / Night', desc: 'As silent as the hardware allows.', vectors: ['cpu.burst', 'ambient.chassis'],
        when: 'Schedule 22:00–07:00',
        rows: [row(OK, 'Profile → quiet', 'Power-saver in power-profiles-daemon'), row(OK, 'CPU preference → power', 'Turbo on demand'), row(NA, 'Boosts', 'Only at critical temperature')] },
      { id: 'battery', cat: 'idle', name: 'On Battery', desc: 'Longest runtime with the dGPU kept idle.', vectors: ['gpu.idle-leak'],
        when: 'When AC is unplugged',
        rows: [row(OK, 'Profile → quiet', 'Power-saver in power-profiles-daemon'), row(PART, 'dGPU sleep', 'Not supported: suggests Intel-only mode'), row(NA, 'Boosts', 'Disabled')] },
      { id: 'cooldown', cat: 'intense', name: 'Cool-down', desc: 'Holds fans up after heavy load, then steps down.', vectors: ['all vectors'],
        when: 'After a heavy template ends',
        rows: [row(OK, 'Fans held until zones cool', 'Baseline + 5 °C'), row(OK, 'Then back to the power-source default', 'Performance on AC, quiet on battery')] }
    ];
    const filters = [['all', 'All'], ['intense', 'Intense'], ['optimal', 'Optimal'], ['idle', 'Idle']].map(([id, label]) => ({
      label,
      pressed: id === filter ? 'true' : 'false',
      style: id === filter ? 'background: #C1FF14; color: #0A0F05;' : 'color: #B9BDC6;',
      pick: () => this.setState({ filter: id })
    }));
    const cards = T.filter((t) => filter === 'all' || t.cat === filter).map((t) => ({
      name: t.name, desc: t.desc, vectors: t.vectors, icon: ICON[t.id],
      cat: CAT[t.cat].label, color: CAT[t.cat].color, iconBg: CAT[t.cat].bg,
      pressed: t.id === selected ? 'true' : 'false',
      border: t.id === selected ? 'border: 1.5px solid #C1FF14; box-shadow: 0 0 0 4px rgba(193, 255, 20, 0.08);' : 'border: 1px solid rgba(255, 255, 255, 0.06);',
      pick: () => this.setState({ selected: t.id })
    }));
    const s = T.find((t) => t.id === selected) || T[0];
    return {
      filters,
      cards,
      sel: { name: s.name, cat: CAT[s.cat].label, when: s.when, rows: s.rows, heroStyle: CAT[s.cat].hero }
    };
  }
}
</script>
</body>
</html>
